<svg xmlns="http://www.w3.org/2000/svg" width="900" height="85" viewBox="0 0 900 85" role="img" aria-labelledby="commitlog-title">
  <title id="commitlog-title">Commit Log</title>
  <defs>
    <linearGradient id="commitlog-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D95B82"/>
      <stop offset="0.55" stop-color="#5C2E45"/>
      <stop offset="1" stop-color="#2A121D"/>
    </linearGradient>
    <filter id="commitlog-underline-glow" x="-100%" y="-300%" width="300%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="0" y="16" fill="#D95B82" font-family="Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="11" font-weight="600" letter-spacing="2">05 COMMIT LOG</text>
  <text x="900" y="16" text-anchor="end" fill="#A8959E"
        font-family="Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="10" letter-spacing="1.5">REAL DATA · REFRESHED DAILY</text>
  <text x="0" y="58" fill="#F5EDF0" font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="700">A year of building.</text>
  <rect x="0" y="74" width="900" height="1" fill="url(#commitlog-rule)"/>
  <line x1="-58" y1="74.5" x2="-4" y2="74.5" stroke="#D96389" stroke-width="1" stroke-opacity="0.34" stroke-linecap="round">
    <animate attributeName="x1" values="-58;846;846" keyTimes="0;0.82;1" dur="2.8s" begin="1s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-4;900;900" keyTimes="0;0.82;1" dur="2.8s" begin="1s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0.34;0.34;0" keyTimes="0;0.08;0.82;1" dur="2.8s" begin="1s" repeatCount="indefinite"/>
  </line>
  <g filter="url(#commitlog-underline-glow)">
    <circle r="4.5" cx="0" cy="74.5" fill="#F4A6C1" opacity="0">
      <animate attributeName="cx" values="0;900;900" keyTimes="0;0.82;1" dur="2.8s" begin="1s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.72;0.72;0" keyTimes="0;0.08;0.82;1" dur="2.8s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.9" cx="0" cy="74.5" fill="#FFF7FA" opacity="0">
      <animate attributeName="cx" values="0;900;900" keyTimes="0;0.82;1" dur="2.8s" begin="1s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.82;1" dur="2.8s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
