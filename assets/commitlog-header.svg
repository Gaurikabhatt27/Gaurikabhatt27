<svg xmlns="http://www.w3.org/2000/svg" width="900" height="85" viewBox="0 0 900 85" role="img" aria-labelledby="commitlog-title">
  <title id="commitlog-title">Commit Log</title>
  <defs>
    <linearGradient id="commitlog-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D95B82"/>
      <stop offset="0.55" stop-color="#5C2E45"/>
      <stop offset="1" stop-color="#2A121D"/>
    </linearGradient>
  </defs>

  <text x="0" y="16" fill="#D95B82" font-family="Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="11" font-weight="600" letter-spacing="2">05 COMMIT LOG</text>
  <text x="900" y="16" text-anchor="end" fill="#A8959E"
        font-family="Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="10" letter-spacing="1.5">REAL DATA · REFRESHED DAILY</text>
  <text x="0" y="58" fill="#F5EDF0" font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="700">A year of building.</text>
  <rect x="0" y="74" width="900" height="1" fill="url(#commitlog-rule)"/>
