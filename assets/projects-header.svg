<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" role="img" aria-labelledby="projects-title">
  <title id="projects-title">Selected work</title>
  <defs>
    <linearGradient id="ph-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A3B58"/>
      <stop offset=".72" stop-color="#4A2031"/>
      <stop offset="1" stop-color="#2A121D"/>
    </linearGradient>
    <filter id="ph-underline-glow" x="-100%" y="-300%" width="300%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="0" y="16" fill="#D96389" font-family="Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2">03 SELECTED WORK</text>
  <text x="900" y="16" text-anchor="end" fill="#8C7A85" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">SEVEN PROJECTS · REAL-WORLD PROBLEMS</text>
  <text x="0" y="58" fill="#F5EDF0" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700">Products, not assignments.</text>
  <rect x="0" y="74" width="900" height="1" fill="url(#ph-rule)"/>
  <line x1="-58" y1="74.5" x2="-4" y2="74.5" stroke="#D96389" stroke-width="1" stroke-opacity="0.34" stroke-linecap="round">
    <animate attributeName="x1" values="-58;846;846" keyTimes="0;0.82;1" dur="3.1s" begin="0.5s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-4;900;900" keyTimes="0;0.82;1" dur="3.1s" begin="0.5s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0.34;0.34;0" keyTimes="0;0.08;0.82;1" dur="3.1s" begin="0.5s" repeatCount="indefinite"/>
  </line>
  <g filter="url(#ph-underline-glow)">
    <circle r="4.5" cx="0" cy="74.5" fill="#F4A6C1" opacity="0">
      <animate attributeName="cx" values="0;900;900" keyTimes="0;0.82;1" dur="3.1s" begin="0.5s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.72;0.72;0" keyTimes="0;0.08;0.82;1" dur="3.1s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.9" cx="0" cy="74.5" fill="#FFF7FA" opacity="0">
      <animate attributeName="cx" values="0;900;900" keyTimes="0;0.82;1" dur="3.1s" begin="0.5s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.82;1" dur="3.1s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
