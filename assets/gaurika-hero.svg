
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="360" viewBox="0 0 1200 360">

  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="55%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#451126"/>
    </linearGradient>

    <linearGradient id="g-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C77B9B" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform"
        type="translate" from="-1 0" to="1 0"
        dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="g-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8F0F3"/>
      <stop offset="100%" stop-color="#E5B5C7"/>
    </linearGradient>

    <pattern id="g-grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none"
            stroke="#C77B9B" stroke-opacity=".10"
            stroke-width=".7"/>
    </pattern>

    <filter id="g-glow" x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="g-clip">
      <rect width="1200" height="360" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#g-clip)">
    <rect width="1200" height="360" fill="url(#g-bg)"/>
    <rect width="1200" height="360" fill="url(#g-grid)"/>

    <ellipse cx="1030" cy="170" rx="280" ry="190"
             fill="#701A3D" opacity=".16"/>
    <ellipse cx="1030" cy="170" rx="190" ry="140"
             fill="#C77B9B" opacity=".06"/>

    <rect x="-500" y="0" width="500" height="360"
          fill="url(#g-light)" opacity=".35">
      <animate attributeName="x"
        values="-500;1200" dur="10s"
        repeatCount="indefinite"/>
    </rect>

    <g fill="none" stroke="#C77B9B"
       stroke-opacity=".35">
      <circle cx="1000" cy="180" r="105"
              stroke-dasharray="3 10"/>
      <circle cx="1000" cy="180" r="145"
              stroke-dasharray="2 14"/>
      <path d="M800 180H1200M1000 30V330"
            stroke-opacity=".12"/>
    </g>

    <path d="M650 260 C760 260 770 80 900 110
             S1050 280 1190 90"
          fill="none" stroke="#C77B9B"
          stroke-width="2" stroke-opacity=".6"
          filter="url(#g-glow)"
          stroke-dasharray="900"
          stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset"
        from="900" to="0" dur="5s"
        repeatCount="indefinite"/>
    </path>

    <circle cx="900" cy="110" r="4"
            fill="#E5B5C7" filter="url(#g-glow)">
      <animate attributeName="opacity"
        values=".3;1;.3" dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="82" y="92" fill="#C77B9B"
            font-size="13" letter-spacing="5">
        HELLO, WORLD
      </text>

      <text x="78" y="169" fill="url(#g-text)"
            font-size="57" font-weight="700"
            letter-spacing="1">
        GAURIKA BHATT
      </text>

      <rect x="82" y="190" width="270" height="2"
            rx="1" fill="#C77B9B">
        <animate attributeName="width"
          values="120;270;120" dur="5s"
          repeatCount="indefinite"/>
      </rect>

      <text x="82" y="237" fill="#E5B5C7"
            font-size="17" letter-spacing="2">
        DATA SCIENCE  |  MACHINE LEARNING  |  AI
      </text>

      <text x="82" y="278" fill="#F8F0F3"
            font-size="14" opacity=".75">
        Engineering intelligent, data-driven solutions.
      </text>

      <text x="1115" y="325" text-anchor="end"
            fill="#C77B9B" font-size="10"
            letter-spacing="3" opacity=".7">
        BUILD  •  ANALYZE  •  INNOVATE
      </text>
    </g>

    <path d="M0 340H1200" stroke="#C77B9B"
          stroke-opacity=".3"/>
  </g>
</svg>
