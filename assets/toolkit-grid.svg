    <rect x="313" y="22" width="274" height="200" rx="11" fill="#240F1A" fill-opacity="0.92" stroke="#71304C" stroke-width="1"><animate attributeName="stroke-opacity" values="0.55;0.9;0.55" dur="4.8s" begin="0.35s" repeatCount="indefinite"/></rect>
