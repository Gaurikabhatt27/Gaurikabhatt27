    <rect x="313" y="238" width="274" height="200" rx="11" fill="#240F1A" fill-opacity="0.92" stroke="#71304C" stroke-width="1"/>
    <rect x="604" y="238" width="274" height="200" rx="11" fill="#240F1A" fill-opacity="0.92" stroke="#71304C" stroke-width="1"/>
  </g>

