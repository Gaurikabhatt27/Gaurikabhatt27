    <text x="626" y="376" fill="#CDBAC2" font-family="Georgia, 'Times New Roman', serif" font-size="15">DSA · OOP</text>
    <text x="626" y="402" fill="#BBA7AF" font-family="Georgia, 'Times New Roman', serif" font-size="14.5">CSE Fundamentals</text>
    <text x="626" y="424" fill="#A9919B" font-family="Consolas, 'Liberation Mono', Menlo, monospace"
