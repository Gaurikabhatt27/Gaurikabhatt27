    <animate attributeName="stroke-dashoffset" from="0" to="-3080" dur="4.1s" calcMode="spline" keyTimes="0;1" keySplines="0.42 0 0.58 1" repeatCount="indefinite"/>
  </rect>
  <rect x="0.75" y="0.75" width="898.5" height="458.5" rx="15.25"
        fill="none" stroke="#F2A3C0" stroke-width="3.5" stroke-opacity="0.12"
        stroke-dasharray="32 3048" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="-10" to="-3090" dur="4.1s" calcMode="spline" keyTimes="0;1" keySplines="0.42 0 0.58 1" repeatCount="indefinite"/>
  </rect>
  <g fill="#FFE8F1">
