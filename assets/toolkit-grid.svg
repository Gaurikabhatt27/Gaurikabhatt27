<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="toolkit-grid-title toolkit-grid-desc">
  <title id="toolkit-grid-title">Data science and engineering toolkit</title>
  <desc id="toolkit-grid-desc">A six-category bento grid covering languages, AI and machine learning, data analytics, web development, databases, and tools.</desc>
  <defs>
    <linearGradient id="toolkit-panel" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1A0C13"/>
      <stop offset="0.54" stop-color="#381224"/>
      <stop offset="1" stop-color="#591835"/>
    </linearGradient>
    <radialGradient id="toolkit-glow" cx="0.50" cy="0.48" r="0.62">
      <stop offset="0" stop-color="#A82463" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#701A3D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1A0C13" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="460" rx="16" fill="url(#toolkit-panel)" stroke="#5E263E" stroke-width="1"/>
  <rect x="1" y="1" width="898" height="458" rx="15" fill="url(#toolkit-glow)"/>
  <rect x="0.75" y="0.75" width="898.5" height="458.5" rx="15.25"
