  </line>
  <text x="500" y="62" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#E5B5C7" letter-spacing="2">BUILDING, LEARNING, AND TURNING IDEAS INTO IMPACT</text>
