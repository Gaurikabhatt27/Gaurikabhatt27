<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">Gaurika Bhatt signature footer</title>
  <desc id="footer-desc">Gaurika Bhatt, Data Science and AI/ML engineering portfolio signature.</desc>
  <defs>
    <radialGradient id="footer-glow" cx="0.50" cy="0.88" r="0.58">
      <stop offset="0" stop-color="#7A1C46" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#451126" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#140910" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="footer-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140910"/>
      <stop offset="0.32" stop-color="#6B1A3E"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="0.68" stop-color="#6B1A3E"/>
      <stop offset="1" stop-color="#140910"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" fill="#140910"/>
  <rect width="900" height="220" fill="url(#footer-glow)">
    <animate attributeName="opacity" values="0.72;1;0.72" dur="5.2s" repeatCount="indefinite"/>
  </rect>
  <g fill="#C77B9B" fill-opacity="0.28">
    <circle cx="92" cy="54" r="1"/><circle cx="145" cy="166" r="1"/>
    <circle cx="218" cy="82" r="0.8"/><circle cx="684" cy="70" r="1"/>
    <circle cx="786" cy="154" r="0.8"/><circle cx="816" cy="48" r="1"/>
  </g>
  <text x="450" y="82" text-anchor="middle" fill="#F5EDF0"
        font-family="Instrument Serif, Newsreader, Lora, Georgia, 'Times New Roman', serif"
        font-size="42" font-style="italic" font-weight="500" letter-spacing="-0.8">Gaurika Bhatt</text>
  <line x1="210" y1="116" x2="690" y2="116" stroke="url(#footer-line)" stroke-width="1"/>
  <circle cx="450" cy="116" r="3" fill="#E06C88">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="210" y1="116" x2="690" y2="116" stroke="#F2A3C0" stroke-width="1"
        stroke-opacity="0.62" stroke-dasharray="70 620" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-690" dur="4.4s" calcMode="spline" keyTimes="0;1" keySplines="0.42 0 0.58 1" repeatCount="indefinite"/>
  </line>
  <text x="450" y="158" text-anchor="middle" fill="#F0E4EA" font-family="Georgia, 'Times New Roman', serif" font-size="20">Building intelligent systems with purpose.</text>
  <text x="450" y="190" text-anchor="middle" fill="#C9B1BC" font-family="Consolas, monospace" font-size="9" letter-spacing="2.4">DATA SCIENCE · AI/ML · ENGINEERING</text>
</svg>
