      <animate attributeName="opacity" values="0;0.92;0.92;0" keyTimes="0;0.08;0.82;1" dur="2.7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="0.9" cx="0" cy="74.5" fill="#FFF7FA" opacity="0">
