<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="about-title about-desc">
  <title id="about-title">About Gaurika Bhatt</title>
  <desc id="about-desc">A terminal-style and card-based overview of Gaurika Bhatt's education and technical interests.</desc>
  <defs>
    <linearGradient id="about-divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A3B58"/>
      <stop offset="0.72" stop-color="#4A2031"/>
      <stop offset="1" stop-color="#2A121D"/>
    </linearGradient>
    <linearGradient id="about-panel" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1A0C13"/>
      <stop offset="0.54" stop-color="#381224"/>
      <stop offset="1" stop-color="#591835"/>
    </linearGradient>
    <radialGradient id="about-glow" cx="0.88" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#8F3158" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#591835" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1A0C13" stop-opacity="0"/>
    </radialGradient>
    <filter id="about-underline-glow" x="-100%" y="-300%" width="300%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="0" y="16" fill="#D46A92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="11" font-weight="600" letter-spacing="2">01 ABOUT</text>
  <text x="900" y="16" text-anchor="end" fill="#8C7A85"
        font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="10" letter-spacing="1.5">WHO I AM</text>
  <text x="0" y="58" fill="#F5EDF0" font-family="Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="700">
    <tspan> Hello, I'm </tspan>
    <tspan fill="#F4A6C1" font-family="'Brush Script MT', 'Segoe Script', 'URW Chancery L', 'Apple Chancery', cursive"
           font-size="36" font-weight="700">Gaurika</tspan>
    <tspan>.</tspan>
  </text>
  <rect x="0" y="74" width="900" height="1" fill="url(#about-divider)"/>
  <line x1="-58" y1="74.5" x2="-4" y2="74.5" stroke="#D96389" stroke-width="1"
        stroke-opacity="0.34" stroke-linecap="round">
    <animate attributeName="x1" values="-58;846;846" keyTimes="0;0.82;1" dur="2.7s" begin="0s"
             calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-4;900;900" keyTimes="0;0.82;1" dur="2.7s" begin="0s"
