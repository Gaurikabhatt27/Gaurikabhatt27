    <animate attributeName="stroke-dashoffset" from="0" to="-2750" dur="3.6s" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1" repeatCount="indefinite"/>
  </rect>
  <rect x="0.75" y="94.75" width="898.5" height="368.5" rx="13.25"
        fill="none" stroke="#F2A3C0" stroke-width="3.5" stroke-opacity="0.12"
        stroke-dasharray="28 2722" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="-12" to="-2762" dur="3.6s" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1" repeatCount="indefinite"/>
  </rect>
  <g fill="#FFE8F1" stroke="#E8A0B8" stroke-width="0.45">
