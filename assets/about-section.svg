      <animate attributeName="opacity" values="0;0.72;0.72;0" keyTimes="0;0.08;0.82;1" dur="2.7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" cx="0" cy="74.5" fill="#F4A6C1" opacity="0">
      <animate attributeName="cx" values="0;900;900" keyTimes="0;0.82;1" dur="2.7s" begin="0s"
