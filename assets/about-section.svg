    <circle cx="38" cy="133" r="4" fill="#C84B73"/>
    <circle cx="54" cy="133" r="4" fill="#8E3554"/>
    <circle cx="70" cy="133" r="4" fill="#5C2238"/>
    <text x="322" y="137" text-anchor="middle" fill="#B8A8B0"
          font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
          font-size="12">gaurika@portfolio: ~</text>

    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13">
      <text x="44" y="174" fill="#D46A92">$ </text>
      <text x="63" y="174" fill="#F5EDF0" font-weight="700">whoami</text>
      <text x="44" y="196" fill="#D46A92">→ </text>
      <text x="63" y="196" fill="#E2D5DA">Gaurika Bhatt · Data Science · AI/ML</text>

      <text x="44" y="224" fill="#D46A92">$ </text>
      <text x="63" y="224" fill="#F5EDF0" font-weight="700">cat education.txt</text>
      <text x="44" y="246" fill="#D46A92">→ </text>
      <text x="63" y="246" fill="#E2D5DA">B.Tech CSE · Lovely Professional University · CGPA 8.86</text>

      <text x="44" y="274" fill="#D46A92">$ </text>
      <text x="63" y="274" fill="#F5EDF0" font-weight="700">cat languages.txt</text>
      <text x="44" y="296" fill="#D46A92">→ </text>
      <text x="63" y="296" fill="#E2D5DA">Python · SQL · C++</text>

      <text x="44" y="324" fill="#D46A92">$ </text>
      <text x="63" y="324" fill="#F5EDF0" font-weight="700">ls ./analytics</text>
      <text x="44" y="346" fill="#D46A92">→ </text>
      <text x="63" y="346" fill="#E2D5DA">Excel · Power BI · Pandas · NumPy</text>

      <text x="44" y="374" fill="#D46A92">$ </text>
      <text x="63" y="374" fill="#F5EDF0" font-weight="700">echo $INTERESTS</text>
      <text x="44" y="396" fill="#D46A92">→ </text>
      <text x="63" y="396" fill="#E2D5DA">Data Science · Machine Learning · Artificial Intelligence</text>

      <rect x="44" y="407" width="7" height="14" fill="#F5EDF0">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g>
    <g>
      <rect x="640" y="116" width="238" height="99" rx="8" fill="#240F1A" fill-opacity="0.88" stroke="#4D2134" stroke-width="1"/>
