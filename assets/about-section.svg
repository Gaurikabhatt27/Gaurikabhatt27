      <text x="656" y="199" fill="#A69099"
            font-family="'Segoe UI', Arial, sans-serif" font-size="10.5">Data science · ML</text>
    </g>

    <g>
      <rect x="640" y="229" width="238" height="99" rx="8" fill="#240F1A" fill-opacity="0.88" stroke="#4D2134" stroke-width="1"/>
      <rect x="640" y="229" width="3" height="99" rx="1.5" fill="#D95C88"/>
      <text x="656" y="252" fill="#C87A96"
            font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
            font-size="9.5" letter-spacing="1.2">ANALYTICS</text>
      <text x="656" y="290" fill="#F5EDF0" font-family="Georgia, 'Times New Roman', serif"
            font-size="21" font-weight="700">SQL</text>
      <text x="656" y="312" fill="#A69099"
            font-family="'Segoe UI', Arial, sans-serif" font-size="10.5">Excel · Power BI</text>
    </g>

    <g>
      <rect x="640" y="342" width="238" height="99" rx="8" fill="#240F1A" fill-opacity="0.88" stroke="#4D2134" stroke-width="1"/>
      <rect x="640" y="342" width="3" height="99" rx="1.5" fill="#D95C88"/>
      <text x="656" y="365" fill="#C87A96"
            font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
            font-size="9.5" letter-spacing="1.2">INTERESTED IN</text>
      <text x="656" y="403" fill="#F5EDF0" font-family="Georgia, 'Times New Roman', serif"
            font-size="21" font-weight="700">AI/ML</text>
      <text x="656" y="425" fill="#A69099"
            font-family="'Segoe UI', Arial, sans-serif" font-size="10.5">Intelligent systems</text>
