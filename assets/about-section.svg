    <path d="M866 448l2.2 4.2 4.2 2.2-4.2 2.2-2.2 4.2-2.2-4.2-4.2-2.2 4.2-2.2z" fill-opacity="0.72">
      <animate attributeName="opacity" values="0.12;0.82;0.12" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <rect x="22" y="116" width="600" height="326" rx="10" fill="#150C11" fill-opacity="0.92" stroke="#3B1C2A" stroke-width="1"/>
    <rect x="22" y="116" width="600" height="34" rx="10" fill="#150C11" fill-opacity="0.96"/>
