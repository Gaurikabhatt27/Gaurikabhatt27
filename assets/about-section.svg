    </circle>
  </g>

  <rect x="0" y="94" width="900" height="370" rx="14" fill="url(#about-panel)" stroke="#5E263E" stroke-width="1"/>
  <rect x="0" y="94" width="900" height="370" rx="14" fill="url(#about-glow)">
    <animate attributeName="opacity" values="0.72;1;0.72" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="0.75" y="94.75" width="898.5" height="368.5" rx="13.25"
